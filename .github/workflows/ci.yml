name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only GITHUB_TOKEN: no job pushes, comments or deploys (artifacts use their own token)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate YAML syntax
        run: |
          python3 -c "
          import yaml, glob, sys
          files = glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True)
          errors = 0
          for f in files:
              try:
                  with open(f, 'r', encoding='utf-8') as stream:
                      yaml.safe_load(stream)
              except Exception as e:
                  print(f'YAML error in {f}: {e}', file=sys.stderr)
                  errors += 1
          if errors > 0:
              sys.exit(1)
          print(f'Successfully validated {len(files)} YAML files.')
          "

      - name: Validate JavaScript syntax
        run: |
          find assets -type f -name "*.js" -exec node --check {} +
          echo "JavaScript syntax check passed."

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run JavaScript unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Jekyll Doctor
        run: bundle exec jekyll doctor

      - name: Build site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 3
          # Same content as the Pages deployment, including /.well-known/
          include-hidden-files: true

  browser-tests:
    name: Browser tests (visualizer and GEO files)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright, axe-core and GEO file tests
        run: npx playwright test
        env:
          SITE_DIR: _site

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
